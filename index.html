<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dream House Walkthrough</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0a0f; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas { display: block; }
  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.8);
    pointer-events: none; z-index: 10;
  }
  #hud {
    position: fixed; top: 16px; left: 16px; color: #eee; z-index: 10;
    background: rgba(20,10,30,0.55); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; line-height: 1.5; max-width: 260px; border: 1px solid #7f77dd55;
  }
  #hud b { color: #b9a6ff; }
  #roomLabel {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; z-index: 10; background: rgba(20,10,30,0.65);
    padding: 8px 20px; border-radius: 20px; font-size: 15px;
    border: 1px solid #7f77dd55; letter-spacing: 0.5px;
  }
  #blocker {
    position: fixed; inset: 0; background: rgba(10,5,15,0.9); z-index: 20;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #eee; text-align: center; cursor: pointer;
  }
  #blocker h1 { color: #b9a6ff; margin-bottom: 8px; font-weight: 500; }
  #blocker p { color: #aaa; max-width: 380px; font-size: 14px; line-height: 1.6; }
  #minimap {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    border: 1px solid #7f77dd55; border-radius: 8px; background: rgba(20,10,30,0.55);
  }
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="hud">
  <b>WASD</b> move &nbsp; <b>Click + drag</b> to look &nbsp; <b>Shift</b> run
</div>
<div id="roomLabel">Front Porch</div>
<canvas id="minimap" width="160" height="160"></canvas>
<div id="blocker">
  <h1>Your Dream House</h1>
  <p>Click to walk in. Use WASD to move, and click + drag anywhere to look around. This is a rough first pass — basic shapes and colors just to get the layout and scale right.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0b14);
scene.fog = new THREE.Fog(0x0e0b14, 15, 70);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const EYE_HEIGHT = 1.7;
camera.position.set(0, EYE_HEIGHT, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
const hemi = new THREE.HemisphereLight(0xbcd7ff, 0x2a2035, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 0.9);
sun.position.set(20, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
scene.add(sun);

// ---------- Materials (rough color-block first pass) ----------
const mat = (color, opts={}) => new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0.05, ...opts });

const M = {
  ground: mat(0x3a4a2e),
  driveway: mat(0x555555),
  porch: mat(0x6b4a30),
  wallOuter: mat(0xcfae87),
  wallInner: mat(0xece3d6),
  roof: mat(0x2b2b2b),
  floorWood: mat(0x7a5230),
  floorTile: mat(0xb5754a),
  floorCarpetGray: mat(0xa89f8f),
  kitchen: mat(0x8fae7a),
  living: mat(0x7b4b3a),
  dining: mat(0x9c7a4e),
  homeschool: mat(0xffffff),
  homeschoolAccent: mat(0xd946a3),
  boysRoom: mat(0x4a5a6b),
  girlsRoom: mat(0xf2c6d8),
  office: mat(0x1c1c22),
  officeAccent: mat(0x7f4fd8),
  master: mat(0xd9d2c4),
  closet: mat(0x5a3d28),
  bathroom: mat(0xdfe6e8),
  shedOutside: mat(0x3a7a6b),
  garden: mat(0x4a6b2e),
  greenhouse: mat(0x88c0a0, { transparent: true, opacity: 0.35 }),
  fence: mat(0x6b5030),
  glass: new THREE.MeshStandardMaterial({ color: 0xbcd7ff, transparent: true, opacity: 0.25, roughness: 0.1 }),
  door: mat(0x3a2418),
  furniture: mat(0x4a3826),
  accentBlack: mat(0x111111),
  accentPurple: mat(0x6a4fc9),
};

const rooms = []; // {name, minX,maxX,minZ,maxZ, labelY}
const walls = []; // collidable boxes {minX,maxX,minZ,maxZ}
const group = new THREE.Group();
scene.add(group);

function box(w,h,d,material,x,y,z,ry=0){
  const geo = new THREE.BoxGeometry(w,h,d);
  const m = new THREE.Mesh(geo, material);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  group.add(m);
  return m;
}

function addWallCollider(cx, cz, w, d){
  walls.push({minX: cx - w/2, maxX: cx + w/2, minZ: cz - d/2, maxZ: cz + d/2});
}

function floorPanel(cx, cz, w, d, material, y=0){
  box(w, 0.2, d, material, cx, y, cz);
}

function wallSegment(cx, cz, length, height, thickness, material, rotated=false){
  const w = rotated ? thickness : length;
  const d = rotated ? length : thickness;
  box(w, height, d, material, cx, height/2, cz);
  addWallCollider(cx, cz, w + 0.3, d + 0.3);
}

function doorway(cx, cz, length, height, thickness, material, rotated=false, gap=1.6){
  // build wall with a gap in the middle for a doorway
  const half = (length - gap)/2;
  if (half <= 0) return;
  if (!rotated){
    wallSegment(cx - gap/2 - half/2, cz, half, height, thickness, material, false);
    wallSegment(cx + gap/2 + half/2, cz, half, height, thickness, material, false);
  } else {
    wallSegment(cx, cz - gap/2 - half/2, half, height, thickness, material, true);
    wallSegment(cx, cz + gap/2 + half/2, half, height, thickness, material, true);
  }
}

function roomLabel(name, minX, maxX, minZ, maxZ){
  rooms.push({name, minX, maxX, minZ, maxZ});
}

function simpleProp(w,h,d,material,x,y,z,ry=0){
  box(w,h,d,material,x,y+h/2,z,ry);
}

const WALL_H = 3.0;
const T = 0.2; // wall thickness

/* ============ LAYOUT ============
   Central hub: Living(Z 0..-8) + Kitchen/Dining(Z -8..-16), X -6..6
   Family wing (west, -X): Homeschool + kids bedrooms
   Quiet wing (east, +X): Master suite + Office/Game room
   Outside: porch front (Z > 0), backyard rear (Z < -16), she-shed + greenhouse side
================================= */

// ---- Ground ----
floorPanel(0, -5, 120, 120, M.ground, -0.1);
floorPanel(0, 16, 6, 14, M.driveway, -0.05); // driveway leading to porch

// ================= FRONT PORCH =================
floorPanel(0, 8, 14, 6, M.porch, 0.05);
roomLabel("Front Porch", -7, 7, 5, 11);
// porch roof posts
[-6,-2,2,6].forEach(x => simpleProp(0.3,2.6,0.3, M.furniture, x, 0, 10.8));
box(14.4, 0.3, 6.4, M.roof, 0, 2.7, 8);
// rocking chairs (simple props)
simpleProp(0.6,0.9,0.6, M.living, -3, 0.1, 9.5);
simpleProp(0.6,0.9,0.6, M.living, -1.8, 0.1, 9.5);

// ================= LIVING ROOM =================
floorPanel(0, -3.5, 12, 7, M.floorWood, 0.05);
roomLabel("Living Room", -6, 6, -7, 0);
simpleProp(4,0.8,2, M.living, 0, 0.1, -3, 0); // sunken sectional block
simpleProp(1.2,0.5,1.2, M.furniture, 0, 0.1, -1.5); // coffee table
box(3, 1.6, 0.3, M.accentBlack, -5.85, 0.8, -3); // fireplace hint on west wall

// front doorway (porch -> living)
doorway(0, 4.5, 12, WALL_H, T, M.wallOuter, false, 2.2);

// ================= KITCHEN / DINING (rear-center) =================
floorPanel(0, -12, 12, 8, M.floorTile, 0.05);
roomLabel("Kitchen & Dining", -6, 6, -16, -7);
simpleProp(3.6,1.0,1.6, M.kitchen, 1.5, 0.1, -13); // island
simpleProp(2.6,0.9,1.2, M.dining, -2.5, 0.1, -14); // dining table
simpleProp(1.5,1.8,0.8, M.furniture, 5.6, 0.1, -14); // double oven / pantry block

// wall separating living / kitchen with open doorway
doorway(0, -7, 12, WALL_H, T, M.wallInner, false, 3);

// rear exterior wall of kitchen with doorway to backyard
doorway(0, -16, 12, WALL_H, T, M.wallOuter, false, 2.2);

// outer side walls of central hub
wallSegment(-6, -8, 16, WALL_H, T, M.wallOuter, true);
wallSegment(6, -8, 16, WALL_H, T, M.wallOuter, true);

// ================= FAMILY WING (west, homeschool + kids) =================
// Homeschool / rec room
floorPanel(-13, -3, 10, 8, M.homeschool, 0.05);
roomLabel("Homeschool & Rec Room", -18, -8, -7, 1);
simpleProp(3.5,0.9,1.4, M.homeschoolAccent, -13, 0.1, -3); // craft table
box(0.3, 2.2, 5, M.homeschoolAccent, -17.8, 1.1, -3); // rainbow shelf wall accent

// Boys room
floorPanel(-13, -12, 8, 7, M.boysRoom, 0.05);
roomLabel("Jakob's Room", -17, -9, -16, -9);
simpleProp(2.4,1.2,1.6, M.furniture, -15.5, 0.1, -14); // loft bed block
box(1.2, 2.2, 1.2, M.accentBlack, -10.5, 1.1, -12.5); // climbing wall hint

// Girls room
floorPanel(-4.5, -12, 7, 7, M.girlsRoom, 0.05);
roomLabel("Elli's Room", -8, -1, -16, -9);
simpleProp(2,1.6,1.4, M.furniture, -6.5, 0.1, -14); // castle bed block

// west wing connecting walls + doorways
doorway(-8, -3, 8, WALL_H, T, M.wallInner, true, 2); // hub <-> homeschool
doorway(-13, -7, 8, WALL_H, T, M.wallInner, false, 1.8); // homeschool <-> boys
doorway(-8, -12, 8, WALL_H, T, M.wallInner, true, 1.8); // boys <-> girls
wallSegment(-18, -7.5, 17, WALL_H, T, M.wallOuter, true); // west outer wall
wallSegment(-8.5, -16, 20, WALL_H, T, M.wallOuter, false); // far wall

// ================= QUIET WING (east, office + master) =================
// Office / Game Room
floorPanel(13, -3, 10, 8, M.office, 0.05);
roomLabel("Office & Game Room", 8, 18, -7, 1);
box(1.6, 1.2, 0.4, M.accentPurple, 17.7, 0.6, -1); // arcade cabinet hint
simpleProp(2.4,0.8,1, M.furniture, 11, 0.1, -1.5); // shared desk
simpleProp(0.6,1.8,0.3, M.accentBlack, 9, 0.9, -5.5); // NECA shelf hint

// Master Suite (bedroom + closet + bath combined block for now)
floorPanel(13, -12, 10, 7, M.master, 0.05);
roomLabel("Master Bedroom", 8, 18, -16, -9);
simpleProp(3,0.9,2.2, M.furniture, 11.5, 0.1, -12.5); // bed
box(2.2, 2.4, 0.3, M.bathroom, 17.8, 1.2, -14.5); // ensuite hint wall
box(2.2, 2.4, 0.3, M.closet, 17.8, 1.2, -10); // closet hint wall

doorway(8, -3, 8, WALL_H, T, M.wallInner, true, 2); // hub <-> office
doorway(13, -7, 8, WALL_H, T, M.wallInner, false, 1.8); // office <-> master
wallSegment(18, -7.5, 17, WALL_H, T, M.wallOuter, true); // east outer wall
wallSegment(13.5, -16, 20, WALL_H, T, M.wallOuter, false);

// front wall segments either side of porch entry
wallSegment(-9, 0, 6, WALL_H, T, M.wallOuter, false);
wallSegment(9, 0, 6, WALL_H, T, M.wallOuter, false);

// ================= ROOFING (simple flat caps for scale) =================
box(38, 0.3, 24, M.roof, 0, WALL_H + 0.15, -8);

// ================= BACKYARD =================
roomLabel("Backyard", -20, 20, -36, -17);
floorPanel(0, -26, 40, 20, M.garden, -0.05);
// raised garden beds
[-14,-10].forEach((x,i)=> simpleProp(3,0.5,1.2, M.furniture, x, 0.1, -20));
// fire pit
simpleProp(1.4,0.4,1.4, M.accentBlack, 4, 0.1, -22);
// chicken coop
simpleProp(2,1.4,1.6, M.furniture, 12, 0.1, -20);
// shaded play area
simpleProp(2.4,2,2.4, M.homeschoolAccent, -4, 0.1, -28);

// greenhouse
box(6, 3, 5, M.greenhouse, 14, 1.5, -30);
roomLabel("Greenhouse", 10, 18, -33, -27);

// she-shed
box(5, 3, 4, M.shedOutside, -16, 1.5, -30);
roomLabel("She Shed", -19, -13, -33, -27);
box(1.2, 2, 0.2, M.accentPurple, -16, 1, -28); // door accent

// backyard fence
function fenceLine(x1,z1,x2,z2){
  const len = Math.hypot(x2-x1, z2-z1);
  const midX = (x1+x2)/2, midZ = (z1+z2)/2;
  const angle = Math.atan2(x2-x1, z2-z1);
  const m = box(len, 1.6, 0.15, M.fence, midX, midZ+0, 0);
  m.position.set(midX, 0.8, midZ);
  m.rotation.y = angle;
}
fenceLine(-20,-17,20,-17);
fenceLine(-20,-17,-20,-36);
fenceLine(20,-17,20,-36);
fenceLine(-20,-36,20,-36);

// ================= TREES / EXTERIOR DRESSING =================
function tree(x,z){
  const trunk = box(0.4,2,0.4, M.furniture, x, 1, z);
  const top = new THREE.Mesh(new THREE.SphereGeometry(1.3,8,8), mat(0x2e5a34));
  top.position.set(x, 2.6, z);
  top.castShadow = true;
  group.add(top);
}
tree(-22, 4); tree(22, 6); tree(-24,-24); tree(24,-24); tree(0,-40); tree(-30,-40); tree(30,-40);

// ================= MINIMAP DRAWING =================
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
function drawMinimap(){
  mmCtx.clearRect(0,0,160,160);
  mmCtx.fillStyle = '#1a1420';
  mmCtx.fillRect(0,0,160,160);
  const scale = 1.8, offX = 80, offZ = 80;
  mmCtx.fillStyle = '#7f77dd88';
  rooms.forEach(r=>{
    const x = offX + r.minX*scale;
    const z = offZ + r.minZ*scale;
    const w = (r.maxX-r.minX)*scale;
    const d = (r.maxZ-r.minZ)*scale;
    mmCtx.fillRect(x, z, w, d);
  });
  // player
  mmCtx.fillStyle = '#ffffff';
  mmCtx.beginPath();
  mmCtx.arc(offX + camera.position.x*scale, offZ + camera.position.z*scale, 3, 0, Math.PI*2);
  mmCtx.fill();
}

// ================= CONTROLS (drag-to-look, no pointer lock needed) =================
const blocker = document.getElementById('blocker');
const roomLabelEl = document.getElementById('roomLabel');
let yaw = Math.PI, pitch = 0;
const move = { f:false, b:false, l:false, r:false, run:false };
let started = false;

function startExperience(){
  started = true;
  blocker.style.display = 'none';
}
blocker.addEventListener('click', startExperience);
blocker.addEventListener('touchstart', startExperience);

// Try pointer lock too (works fine when served over http/https), but don't depend on it
renderer.domElement.addEventListener('click', ()=>{
  if (!started) return;
  if (renderer.domElement.requestPointerLock) {
    renderer.domElement.requestPointerLock().catch(()=>{});
  }
});
document.addEventListener('pointerlockchange', ()=>{
  isPointerLocked = document.pointerLockElement === renderer.domElement;
});
let isPointerLocked = false;

// Drag-to-look fallback (always works, no lock required)
let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('mousedown', (e)=>{
  if (!started || isPointerLocked) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', ()=> dragging = false);
window.addEventListener('mousemove', (e)=>{
  if (!started) return;
  if (isPointerLocked){
    yaw -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
    return;
  }
  if (dragging){
    yaw -= (e.clientX - lastX) * 0.0035;
    pitch -= (e.clientY - lastY) * 0.0035;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
    lastX = e.clientX; lastY = e.clientY;
  }
});
window.addEventListener('keydown', (e)=>{
  switch(e.code){
    case 'KeyW': case 'ArrowUp': move.f = true; break;
    case 'KeyS': case 'ArrowDown': move.b = true; break;
    case 'KeyA': case 'ArrowLeft': move.l = true; break;
    case 'KeyD': case 'ArrowRight': move.r = true; break;
    case 'ShiftLeft': case 'ShiftRight': move.run = true; break;
  }
});
window.addEventListener('keyup', (e)=>{
  switch(e.code){
    case 'KeyW': case 'ArrowUp': move.f = false; break;
    case 'KeyS': case 'ArrowDown': move.b = false; break;
    case 'KeyA': case 'ArrowLeft': move.l = false; break;
    case 'KeyD': case 'ArrowRight': move.r = false; break;
    case 'ShiftLeft': case 'ShiftRight': move.run = false; break;
  }
});

function collides(nx, nz){
  const r = 0.35;
  for (const w of walls){
    if (nx + r > w.minX && nx - r < w.maxX && nz + r > w.minZ && nz - r < w.maxZ){
      return true;
    }
  }
  return false;
}

function currentRoomName(x,z){
  for (const room of rooms){
    if (x >= room.minX && x <= room.maxX && z >= room.minZ && z <= room.maxZ) return room.name;
  }
  return "Outside";
}

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const speed = (move.run ? 6.5 : 3.2) * dt;

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  let dx = 0, dz = 0;
  const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
  if (move.f){ dx -= sinY*speed; dz -= cosY*speed; }
  if (move.b){ dx += sinY*speed; dz += cosY*speed; }
  if (move.l){ dx -= cosY*speed; dz += sinY*speed; }
  if (move.r){ dx += cosY*speed; dz -= sinY*speed; }

  const nx = camera.position.x + dx;
  const nz = camera.position.z + dz;
  if (!collides(nx, camera.position.z)) camera.position.x = nx;
  if (!collides(camera.position.x, nz)) camera.position.z = nz;
  camera.position.y = EYE_HEIGHT;

  roomLabelEl.textContent = currentRoomName(camera.position.x, camera.position.z);
  drawMinimap();

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

})();
</script>
</body>
</html>
